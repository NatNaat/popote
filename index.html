<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Popote</title>
<meta name="theme-color" content="#F4F3F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15141B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Popote">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* Même monde que le Cockpit D2 et Pages contre minutes : lavande, Bricolage Grotesque + IBM Plex Sans, le même hippo. */
:root {
  --bg: #F4F3F7; --surface: #FFFFFF; --surface-2: #E9E7F0; --ink: #1D1B26; --ink-2: #514E63; --muted: #6B6880; --line: #DCDAE6; --line-strong: #B9B6CC;
  --accent: #4A4670; --accent-ink: #FFFFFF; --accent-soft: #E4E1F2; --focus: #4A4670;
  --ok: #3E7C5C; --ok-soft: #E1EFE7; --warn: #B8862B; --warn-soft: #F5ECD6; --bad: #B9503F; --bad-soft: #F6E1DD; --pink: #E79AA8; --teal: #2F7A86; --teal-soft: #DCEEF0; --plum: #8A4A7A; --plum-soft: #F1E3EE;
  --hp: #8C88A8; --hp2: #B4B0CC; --hp3: #6A6686; --hpk: #1A1D1B; --hpp: #E79AA8; --hpg: #E3B341; --hpg2: #B5862A;
  --k-wall: #E9E7F0; --k-dot: #D6D3E4; --k-tile: #F7F6FA; --k-tile2: #D6D3E4; --k-cab: #4A4670; --k-cab2: #625E86; --k-cab3: #8C88A8; --k-app: #B4B0CC; --k-app2: #8C88A8; --k-app3: #D9D5EA; --k-out: #2E2B3F; --k-knob: #E79AA8; --k-floor: #514E63; --k-floor2: #3E3B50; --k-shelf: #6A6686; --k-jar: #2F7A86; --k-jar2: #8A4A7A; --k-sky: #DCEEF0; --k-sun: #E3B341;
  --display: "Bricolage Grotesque", "Avenir Next", Avenir, "Helvetica Neue", sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --r: 16px; --tab: 64px; --ease: cubic-bezier(.2, .8, .2, 1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark;
  --bg: #15141B; --surface: #1D1C25; --surface-2: #282633; --ink: #EDECF3; --ink-2: #C5C2D6; --muted: #918EA6; --line: #312F3E; --line-strong: #4B4860;
  --accent: #B4B0CC; --accent-ink: #15141B; --accent-soft: #2E2B3F; --focus: #B4B0CC;
  --ok: #8CC7A9; --ok-soft: #1F3329; --warn: #E3B341; --warn-soft: #3A2F16; --bad: #E58B7B; --bad-soft: #3D211C; --teal: #7FC4CE; --teal-soft: #17323A; --plum: #D69AC6; --plum-soft: #3A2436; --k-wall: #232131; --k-dot: #2C2A3B; --k-tile: #33303F; --k-tile2: #413E52; --k-cab: #3A3757; --k-cab2: #4B4860; --k-cab3: #6A6686; --k-app: #8C88A8; --k-app2: #6A6686; --k-app3: #B4B0CC; --k-out: #15141B; --k-knob: #E79AA8; --k-floor: #2A2838; --k-floor2: #1F1D2A; --k-shelf: #4B4860; --k-jar: #7FC4CE; --k-jar2: #D69AC6; --k-sky: #1B2447; --k-sun: #EDE6C8; } }
:root[data-theme="dark"] { color-scheme: dark;
  --bg: #15141B; --surface: #1D1C25; --surface-2: #282633; --ink: #EDECF3; --ink-2: #C5C2D6; --muted: #918EA6; --line: #312F3E; --line-strong: #4B4860;
  --accent: #B4B0CC; --accent-ink: #15141B; --accent-soft: #2E2B3F; --focus: #B4B0CC;
  --ok: #8CC7A9; --ok-soft: #1F3329; --warn: #E3B341; --warn-soft: #3A2F16; --bad: #E58B7B; --bad-soft: #3D211C; --teal: #7FC4CE; --teal-soft: #17323A; --plum: #D69AC6; --plum-soft: #3A2436; --k-wall: #232131; --k-dot: #2C2A3B; --k-tile: #33303F; --k-tile2: #413E52; --k-cab: #3A3757; --k-cab2: #4B4860; --k-cab3: #6A6686; --k-app: #8C88A8; --k-app2: #6A6686; --k-app3: #B4B0CC; --k-out: #15141B; --k-knob: #E79AA8; --k-floor: #2A2838; --k-floor2: #1F1D2A; --k-shelf: #4B4860; --k-jar: #7FC4CE; --k-jar2: #D69AC6; --k-sky: #1B2447; --k-sun: #EDE6C8; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); overscroll-behavior-y: none; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15.5px/1.45 var(--body); overflow-x: hidden; overscroll-behavior-y: none; }
::selection { background: var(--accent-soft); }
h1, h2, h3, p { margin: 0; }
h1, h2, h3, .display { font-family: var(--display); letter-spacing: -.01em; line-height: 1.1; text-wrap: balance; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: 6px; }
[hidden] { display: none !important; }
.muted { color: var(--muted); } .small { font-size: 13px; } .num { font-variant-numeric: tabular-nums; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ───── Structure ───── */
main { min-height: calc(100dvh + 2px); padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px calc(var(--tab) + env(safe-area-inset-bottom, 0px) + 28px); }
main > * { max-width: 620px; margin-left: auto; margin-right: auto; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.topbar h1 { font-size: 26px; font-weight: 800; } .topbar .sub { display: block; font: 500 13px var(--body); color: var(--muted); margin-top: 2px; letter-spacing: 0; }
.topbar .right, .hero .right { display: flex; align-items: center; gap: 8px; }
.gear { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); color: var(--ink-2); box-shadow: 0 2px 0 var(--line); } .gear svg.i { width: 20px; height: 20px; }
.section { margin: 22px 0 12px; } .section h2 { font-size: 17px; font-weight: 700; margin-bottom: 10px; } .section .lead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 10px; } .section .lead h2 { margin: 0; }
.list { background: var(--surface); border: 2px solid var(--line); border-radius: var(--r); padding: 4px 16px; margin-bottom: 14px; }
.setrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); } .setrow:first-of-type { border-top: 0; }
.setrow b { display: block; font: 600 14.5px var(--body); } .setrow span { display: block; font: 500 12.5px var(--body); color: var(--muted); }
.setrow input { width: 96px; text-align: center; padding: 8px; }
.settings { animation: slidein .28s var(--ease) both; }
@keyframes slidein { from { transform: translateX(40px); opacity: 0; } }
.back { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; font: 600 14px var(--body); color: var(--accent); margin-left: -6px; }
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 2px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
nav.tabs div { max-width: 620px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
nav.tabs button { display: grid; justify-items: center; gap: 3px; min-height: var(--tab); padding-top: 8px; font: 600 11px var(--body); color: var(--muted); border-radius: 0; position: relative; }
nav.tabs button[aria-current="page"] { color: var(--accent); } nav.tabs button[aria-current="page"] svg.i { background: var(--accent-soft); }
nav.tabs svg.i { width: 38px; height: 30px; padding: 4px 8px; border-radius: 10px; stroke-width: 2.1; overflow: visible; }
nav.tabs .cnt { position: absolute; top: 6px; left: calc(50% + 8px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font: 700 11px/18px var(--display); text-align: center; }
section.view { animation: fadein .25s ease both; } @keyframes fadein { from { opacity: 0; transform: translateY(4px); } }
#banner { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 8px); left: 16px; right: 16px; z-index: 40; max-width: 620px; margin: 0 auto; box-shadow: 0 4px 14px rgba(20,18,30,.25); padding: 8px 12px; border-radius: 12px; background: var(--warn-soft); color: var(--warn); font: 500 13px/1.4 var(--body); }

/* ───── Cartes et boutons « pressables » ───── */
.card { background: var(--surface); border: 2px solid var(--line); border-radius: var(--r); padding: 16px; margin-bottom: 12px; }
.card.flat { border-width: 1px; } .card.soft { background: var(--surface-2); border-color: transparent; }
.card h2 { font-size: 17px; font-weight: 700; margin-bottom: 10px; }
.card .lead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 8px; } .card .lead h2 { margin: 0; } .card .lead .link { font: 600 13px var(--body); color: var(--accent); min-height: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 20px; border-radius: 14px; font: 700 15px var(--body); letter-spacing: .01em; background: var(--accent); color: var(--accent-ink); border-bottom: 4px solid rgba(0,0,0,.28); transition: transform .08s; text-align: center; }
.btn:active { transform: translateY(3px); border-bottom-width: 1px; }
.btn.ghost { background: var(--surface); color: var(--ink); border: 2px solid var(--line); border-bottom-width: 4px; }
.btn.ghost[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.btn.ok { background: var(--ok); color: #fff; } .btn.warn { background: var(--warn); color: #1D1B26; }
.btn.wide { width: 100%; } .btn.sm { min-height: 40px; padding: 0 14px; font-size: 14px; border-radius: 11px; }
.btn:disabled { opacity: .5; transform: none; }
.link { font: 600 14px var(--body); color: var(--accent); min-height: 40px; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; margin: 0 -16px 12px; padding-left: 16px; padding-right: 16px; } .chips::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 2px solid var(--line); background: var(--surface); font: 600 13.5px var(--body); color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip.wrap { flex: initial; }
.chipwrap { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font: 600 12px var(--body); background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.tag.ok { background: var(--ok-soft); color: var(--ok); } .tag.teal { background: var(--teal-soft); color: var(--teal); } .tag.warn { background: var(--warn-soft); color: var(--warn); } .tag.bad { background: var(--bad-soft); color: var(--bad); } .tag.plum { background: var(--plum-soft); color: var(--plum); }
.row { display: flex; gap: 10px; align-items: center; } .row > * { flex: 1; }
.err { color: var(--bad); font: 500 13.5px var(--body); margin-top: 8px; } .err:empty { display: none; }
label { display: block; font: 600 13px var(--body); color: var(--ink-2); margin: 12px 0 5px; }
input, textarea, select { width: 100%; font: 16px var(--body); color: var(--ink); background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 11px 12px; }
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
textarea { min-height: 110px; resize: vertical; line-height: 1.5; }
input[type=number] { font-variant-numeric: tabular-nums; }
input[type=checkbox] { width: 22px; height: 22px; padding: 0; margin: 0; accent-color: var(--accent); flex: none; }
.quiet { font: 500 14px/1.5 var(--body); color: var(--muted); padding: 6px 0; }
.note { font: 500 13px/1.5 var(--body); color: var(--muted); margin-top: 8px; }
.bar { height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; } .bar i { display: block; height: 100%; width: 100%; background: var(--accent); border-radius: 999px; transform-origin: left; transform: scaleX(0); transition: transform .5s var(--ease); }

/* ───── Accueil ───── */
.hero { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: end; margin-bottom: 2px; }
.tonight.joined { margin-top: 0; }
.hero h1 { font-size: 24px; font-weight: 800; } .hero .greet { font: 500 14px var(--body); color: var(--muted); margin-bottom: 4px; }
.streakpill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px 6px 8px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); font: 700 14px var(--display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.streakpill svg.i { width: 18px; height: 18px; } .streakpill.zero { background: var(--surface); color: var(--muted); border: 2px solid var(--line); }
/* L'ardoise : le menu du soir en couleurs inversées, l'hippo en toque posé sur son bord. */
.board { position: relative; margin: 84px 0 10px; padding: 18px 16px 16px; background: var(--ink); color: var(--bg); border-radius: var(--r); }
.board .eyebrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; font: 600 11.5px var(--body); letter-spacing: .1em; text-transform: uppercase; opacity: .75; }
.board .eyebrow .tag { background: rgba(255,255,255,.14); color: inherit; letter-spacing: 0; text-transform: none; opacity: 1; }
.board .dish { display: block; width: 100%; text-align: left; color: inherit; font: 800 27px/1.08 var(--display); letter-spacing: -.015em; margin: 10px 0 8px; text-wrap: balance; padding-right: 56px; }
.board .meta { font: 500 13.5px/1.4 var(--body); opacity: .8; }
.board .say { margin-top: 14px; padding-top: 12px; border-top: 1px dashed rgba(255,255,255,.28); font: italic 14px/1.4 var(--body); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .board .say { border-top-color: rgba(0,0,0,.25); } :root:not([data-theme="light"]) .board .eyebrow .tag { background: rgba(0,0,0,.12); } }
:root[data-theme="dark"] .board .say { border-top-color: rgba(0,0,0,.25); } :root[data-theme="dark"] .board .eyebrow .tag { background: rgba(0,0,0,.12); }
.board .hp-unit { position: absolute; right: 16px; bottom: calc(100% - 3px); width: 76px; }
.board::before { content: ""; position: absolute; left: 16px; right: 16px; top: -4px; height: 4px; border-radius: 2px 2px 0 0; background: var(--line-strong); }   /* le rebord du comptoir */
.tonight .dish { font: 800 22px/1.15 var(--display); margin: 2px 0 6px; text-wrap: balance; }
.tonight .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.tonight .ings { font: 500 14px/1.5 var(--body); color: var(--ink-2); margin-bottom: 14px; }
.tonight .mode { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.tonight .mode .btn { flex-direction: column; gap: 2px; min-height: 62px; padding: 8px; } .tonight .mode .btn small { font: 500 12px var(--body); opacity: .8; }
.tonight .links { display: flex; justify-content: space-between; gap: 10px; margin-top: 6px; } .tonight .links .link { min-height: 40px; }
.done { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--ok-soft); color: var(--ok); font: 700 15px var(--display); } .done svg.i { width: 26px; height: 26px; } .done .link { margin-left: auto; color: var(--ok); }
.essai { border-color: var(--plum); } .essai h2 { color: var(--plum); } .essai .btn.sm { min-height: 44px; }

.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; margin: 4px 0 14px; background: var(--surface); border: 2px solid var(--line); border-radius: var(--r); overflow: hidden; }
.kpis > div { padding: 12px 12px; } .kpis > div + div { border-left: 2px solid var(--line); } .kpis dt { font: 500 11px/1.25 var(--body); color: var(--muted); } .kpis dd { margin: 4px 0 0; font: 800 17px/1.1 var(--display); font-variant-numeric: tabular-nums; }

/* ───── Couleur par rôle (toujours doublée d'un libellé ou d'une icône) ───── */
.tag.time { background: var(--accent-soft); color: var(--accent); }
.tag.secours { background: var(--warn-soft); color: var(--warn); } .tag.essai { background: var(--plum-soft); color: var(--plum); }
.tonight .mode .btn[data-v="0"][aria-pressed="true"] { background: var(--teal-soft); border-color: var(--teal); color: var(--teal); }
.tonight .mode .btn[data-v="1"][aria-pressed="true"] { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.board::before { background: var(--pink); }
.kpis > div:nth-child(1) dd { color: var(--warn); } .kpis > div:nth-child(2) dd { color: var(--teal); } .kpis > div:nth-child(3) dd { color: var(--plum); }
.c-proteine { color: var(--bad); } .c-feculent { color: var(--warn); } .c-legume { color: var(--ok); } .c-fruit { color: var(--plum); } .c-laitier { color: var(--teal); } .c-sauce { color: var(--accent); } .c-plat { color: var(--ink-2); } .c-autre { color: var(--muted); }
.sortcard { border-top-width: 6px; } .sortcard.c-proteine { border-top-color: var(--bad); } .sortcard.c-feculent { border-top-color: var(--warn); } .sortcard.c-legume { border-top-color: var(--ok); } .sortcard.c-fruit { border-top-color: var(--plum); } .sortcard.c-laitier { border-top-color: var(--teal); } .sortcard.c-sauce { border-top-color: var(--accent); } .sortcard.c-plat { border-top-color: var(--line-strong); } .sortcard.c-autre { border-top-color: var(--line-strong); }
.rayon h3::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 7px; vertical-align: 0; background: var(--line-strong); }
.rayon.k-proteine h3::before { background: var(--bad); } .rayon.k-laitier h3::before { background: var(--teal); } .rayon.k-legume h3::before { background: var(--ok); } .rayon.k-fruit h3::before { background: var(--plum); } .rayon.k-feculent h3::before { background: var(--warn); } .rayon.k-sauce h3::before { background: var(--accent); } .rayon.k-surg h3::before { background: var(--k-sky); } .rayon.k-always h3::before { background: var(--pink); }
.rayon.r-fl h3::before { background: var(--ok); } .rayon.r-boul h3::before { background: var(--warn); } .rayon.r-bch h3::before { background: var(--bad); } .rayon.r-crem h3::before { background: var(--teal); } .rayon.r-epi h3::before { background: var(--plum); } .rayon.r-surg h3::before { background: var(--accent); } .rayon.r-bois h3::before { background: var(--pink); }
.slot { border-left-width: 5px; border-left-color: var(--line-strong); } .slot.prevu { border-left-color: var(--accent); } .slot.fait { border-left-color: var(--ok); } .slot.flemme { border-left-color: var(--warn); } .slot.saute { border-left-color: var(--line); }
.day.today .dn b { color: var(--pink); }
nav.tabs button[aria-current="page"][data-tab="home"] svg.i { background: var(--pink); color: #1D1B26; } nav.tabs button[aria-current="page"][data-tab="week"] svg.i { background: var(--teal-soft); color: var(--teal); } nav.tabs button[aria-current="page"][data-tab="kitchen"] svg.i { background: var(--warn-soft); color: var(--warn); } nav.tabs button[aria-current="page"][data-tab="shop"] svg.i { background: var(--ok-soft); color: var(--ok); } nav.tabs button[aria-current="page"][data-tab="rep"] svg.i { background: var(--plum-soft); color: var(--plum); }
nav.tabs button[aria-current="page"] { color: var(--ink); }

/* ───── Cuisine : une pièce en pixel art qui remplit l'onglet ; frigo et placards se touchent ───── */
.kitchen-full { position: relative; height: calc(100dvh - env(safe-area-inset-top, 0px) - var(--tab) - env(safe-area-inset-bottom, 0px) - 2px); margin: -14px -16px -28px; background: var(--k-wall); overflow: hidden; }
main.kitchen-bg { background: var(--k-wall); }
.kitchen-full svg.scene { display: block; width: 100%; height: 100%; shape-rendering: crispEdges; }
.kitchen-full .hot { fill: transparent; cursor: pointer; } .kitchen-full .hot:active { fill: rgba(255,255,255,.14); }
.kitchen-full .cnt { pointer-events: none; font: 700 5px var(--display); fill: var(--accent-ink); text-anchor: middle; }
.kitchen-full .hp-scene svg { transform-origin: 50% 100%; animation: hp-breathe 3.2s steps(2, end) infinite; }

      <div class="setrow"><div><b>Budget par semaine</b></div><input id="st-budget" type="number" min="10" max="150" value="${c.budgetSemaine || 35}"></div>
      <div class="setrow"><div><b>Magasin</b></div><input id="st-magasin" type="text" value="${esc(c.magasin || "")}" placeholder="Lidl…" style="width:130px;text-align:left"></div>
      <div class="setrow"><div><b>Raccourci Rappels</b></div><input id="st-raccourci" type="text" value="${esc(c.raccourciCourses || "Courses")}" style="width:130px;text-align:left"></div>
      <div class="setrow"><div><b>Essai par semaine</b><span>0 pour désactiver</span></div><input id="st-essai" type="number" min="0" max="1" value="${c.essaiParSemaine ?? 1}"></div></div>
      <button class="btn wide" data-act="save-settings">Enregistrer</button></div>
    <div class="section"><h2>Compte et Claude Code</h2><div class="list">
      <div class="setrow"><div><b>${esc(S.session?.user?.email || "Mode local")}</b><span>${DEMO ? "Les données restent dans ce navigateur" : S.sync === "attente" ? "Modifications en attente de réseau" : "Synchronisé avec Supabase"}</span></div>${api ? `<button class="btn ghost sm" data-act="signout">Se déconnecter</button>` : ""}</div>
      ${api ? `<div class="setrow"><div><b>Clé pour Claude Code</b></div><button class="btn ghost sm" data-act="copy-secret">Copier</button></div>` : ""}</div></div>
    <div class="section"><h2>Données</h2><div class="row"><button class="btn ghost sm" data-act="export">Exporter</button><button class="btn ghost sm" data-act="import">Importer</button></div></div>
    <div class="section"><h2>Diagnostic</h2><pre style="white-space:pre-wrap;font:12px/1.5 ui-monospace,monospace;color:var(--muted)">${esc([`Aliments : ${alimentsList().length} · recettes : ${Object.keys(S.recettes).length} · semaines : ${Object.keys(S.semaines).length} · en attente : ${Object.keys(outbox).length}`, ...d.errors.map(e => `${e.at.slice(11, 19)} ${e.kind} ${e.info}`)].join("\n"))}</pre></div></section>`;
}

// ───────────── Actions ─────────────
tabsEl.addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (b) { tab = b.dataset.tab; setPref("tab", tab); render(); } });
if (!["home", "week", "kitchen", "shop", "rep"].includes(tab)) tab = "home";
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if (!el) return; const act = el.dataset.act, D = el.dataset;
  const w0 = () => week(mondayOf(today()), true);
  try {
    if (act === "tab") { tab = D.tab; setPref("tab", tab); render(); }
    else if (act === "poke") hippoPoke();
    else if (act === "settings") showSettings();
    else if (act === "close-settings") closeSettings();
        else if (act === "compose-week") { const monday = D.monday; await composeDays(monday, weekDays(monday).filter(k => k >= today())); }
    else if (act === "compose-rest") { const monday = D.monday, w = week(monday, true); await composeDays(monday, weekDays(monday).filter(k => k >= today() && slots(k).some(s => !meal(w, k, s) || meal(w, k, s).statut === "prevu"))); }
    else if (act === "recompose-day") { const k = D.k; const w = week(weekId(k), true); for (const s of slots(k)) { const m = meal(w, k, s); if (m && m.statut !== "fait") setMeal(w, k, s, null); } await composeDays(weekId(k), [k]); }
    else if (act === "week-off") { weekOff = Math.max(-8, Math.min(2, weekOff + Number(D.v))); render(); }
    else if (act === "statut") { const w = week(weekId(D.k), true), m = meal(w, D.k, D.slot); if (!m) return; const before = m.statut; m.statut = D.v; if (D.v === "fait") { m.faitLe = new Date().toISOString(); const r = recette(m.flemme && m.secours ? m.secours : m.recette); if (r && S.recettes[r.id]) { r.nbFaits = (r.nbFaits || 0) + 1; saveRecette(r); } } saveSemaine(w, 0); if (D.v === "fait") setPref("lastStreak", streak()); if (D.v === "saute") setPref("lastStreak", streak()); render(); if (D.v === "fait") { hippoCheer(); haptic(); toast("Fait.", () => { m.statut = before; saveSemaine(w, 0); render(); }); } }
    else if (act === "flemme") { const w = week(weekId(D.k), true), m = meal(w, D.k, "soir"); if (!m) return; m.flemme = D.v === "1"; saveSemaine(w); render(); }
    else if (act === "recipe") dlgRecipe(D.id, D.k, D.slot);
    else if (act === "other") dlgOther(D.k, D.slot);
    else if (act === "choose") { const w = week(weekId(D.k), true), m = meal(w, D.k, D.slot) || { secours: rulePick("secours", new Set())?.id || null, statut: "prevu", flemme: false }; m.recette = D.id; m.statut = "prevu"; setMeal(w, D.k, D.slot, m); saveSemaine(w, 0); render(); toast("Repas remplacé."); }
    else if (act === "swap") { const w = week(weekId(D.k), true), a = meal(w, D.k, D.slot), b = meal(w, D.with, D.slot); if (!a || !b) return; [a.recette, b.recette] = [b.recette, a.recette]; [a.secours, b.secours] = [b.secours, a.secours]; saveSemaine(w, 0); render(); toast("Repas échangés."); }
    else if (act === "avis") { const r = recette(D.id); if (!r) return; const next = r.avis === D.v ? null : D.v; const stored = S.recettes[r.id] ? r : Object.assign(clone(r), { source: "base" }); stored.avis = next; saveRecette(stored); if (next === "jamais") toast("Cette recette ne sera plus proposée."); dlgRecipe(D.id, D.k, D.slot); render(); }
    else if (act === "adopt-unknown") { const r = recette(D.id); let n = 0; for (const i of r.ing || []) if (i.inconnu) { const id = "x-" + slug(i.nom); if (!S.aliments[id]) { saveAliment({ id, nom: i.nom, cat: "autre", rayon: "epi", verdict: "ok", essais: [] }); n++; } i.a = id; delete i.inconnu; } if (S.recettes[r.id]) saveRecette(r); toast(`${plural(n, "aliment")} ajouté${n > 1 ? "s" : ""} en « ça va ».`); dlgRecipe(D.id, D.k, D.slot); render(); }
    else if (act === "coche") { const w = w0(); const it = (w.courses?.items || []).find(i => i.k === D.k); if (!it) return; it.coche = !it.coche; haptic(); saveSemaine(w); if (stockable(it.k)) setStock(it.k, it.coche); render(); }
    else if (act === "stock") { if (D.kind) dlgStock(D.kind); else { tab = "kitchen"; setPref("tab", tab); render(); } }
    else if (act === "stock-toggle") { setStock(D.id, !inStock(D.id)); haptic(); const on = inStock(D.id); el.classList.toggle("on", on); el.setAttribute("aria-pressed", on); el.querySelector(".qty").textContent = ""; const c = $("#stock-count"); if (c) c.textContent = plural(stockOf(D.kind).length, "article"); render(); }
    else if (act === "stock-clear") { const d = stockDoc(); d.items = Object.fromEntries(Object.entries(stockItems()).filter(([id]) => FRIDGE_RAYONS.has(alimentRayon(id)) !== (D.kind === "frigo"))); persist("stock", "main", d); dlgStock(D.kind); render(); }
    else if (act === "placard") { const p = new Set(cfg().placard || []); p.has(D.k) ? p.delete(D.k) : p.add(D.k); cfg().placard = [...p]; saveConfig(); if (el.classList.contains("item")) { el.classList.toggle("on", p.has(D.k)); el.setAttribute("aria-pressed", p.has(D.k)); } render(); }
    else if (act === "regen-shop") { const w = week(D.monday || mondayOf(today()), true); buildCourses(w); saveSemaine(w, 0); tab = "shop"; setPref("tab", tab); render(); toast("Liste refaite."); }
    else if (act === "copy-shop") copyText(coursesText(w0()), "Liste copiée.");
    else if (act === "rappels") { const t = coursesText(w0()); if (!t) return toast("Rien à envoyer."); const w = w0(); w.courses.envoyeeLe = new Date().toISOString(); saveSemaine(w); runShortcut(cfg().raccourciCourses || "Courses", t); }
    else if (act === "sort-start") { sorting = true; render(); }
    else if (act === "sort-stop") { sorting = false; if (alimentsList().length >= 12 && !cfg().onboardingFait) { cfg().onboardingFait = true; saveConfig(); } render(); }
    else if (act === "sort-skip") { sortSkip.add(D.id); render(); }
    else if (act === "sort") { const c = CAT_BY_ID[D.id]; saveAliment({ id: c.id, nom: c.nom, cat: c.cat, rayon: c.rayon, verdict: D.v, essais: [] }); haptic(); if (!unsorted().length) { sorting = false; cfg().onboardingFait = true; saveConfig(); toast("Tout est trié."); } render(); }
    else if (act === "rep-v") { repV = D.v; render(); }
    else if (act === "rep-cat") { repCat = D.v; render(); }
    else if (act === "aliment") dlgAliment(D.id);
    else if (act === "verdict") { const a = S.aliments[D.id]; if (!a) return; a.verdict = D.v; saveAliment(a); dlgAliment(D.id); render(); }
    else if (act === "save-aliment") { const a = S.aliments[D.id]; if (!a) return; a.notes = ($("#al-notes")?.value || "").trim().slice(0, 80); saveAliment(a); render(); }
    else if (act === "del-aliment") { const a = S.aliments[D.id]; persist("aliments", D.id, null); render(); toast("Retiré.", () => { saveAliment(a); render(); }); }
    else if (act === "unsort") { const a = S.aliments[D.id]; persist("aliments", D.id, null); render(); toast("Remis dans les cartes.", () => { saveAliment(a); render(); }); }
    else if (act === "add-aliment") dlgAddAliment();
    else if (act === "add-aliment-go") { const nom = ($("#na-nom").value || "").trim(); if (nom.length < 2) return void ($("#na-err").textContent = "Donne un nom."); const id = "x-" + slug(nom); if (S.aliments[id]) return void ($("#na-err").textContent = "Déjà dans le répertoire."); saveAliment({ id, nom, cat: $("#na-cat").value, rayon: $("#na-rayon").value, verdict: D.v, essais: [] }); dlg.close(); render(); toast(`${nom} ajouté.`); }
    else if (act === "essai") { const w = w0(); const e = w.essai; if (!e) return; const a = S.aliments[e.aliment]; if (!a) return; a.essais ||= []; a.essais.push({ date: e.date, prep: e.prep, resultat: D.v }); if (D.v === "adopte") a.verdict = "ok"; else if (D.v === "jamais") a.verdict = "jamais"; e.resultat = D.v; saveAliment(a); saveSemaine(w, 0); render(); if (D.v === "adopte") { hippoCheer(); toast(`${a.nom} adopté.`); } else toast("Noté."); }
    else if (act === "essai-move") dlgEssaiMove();
    else if (act === "essai-date") { const w = w0(); if (w.essai) { w.essai.date = D.k; saveSemaine(w, 0); render(); } }
    else if (act === "essai-swap") { const w = w0(); const cur = w.essai?.aliment; const cands = alimentsList().filter(a => a.verdict === "essai" && a.id !== cur); if (!cands.length) return toast("Pas d'autre aliment « à essayer »."); const a = rnd(cands); w.essai = Object.assign(w.essai || {}, { aliment: a.id, prep: ESSAI_PREP[a.cat] || ESSAI_PREP.autre, pourquoi: "", resultat: null, date: w.essai?.date || addDays(w.id, 6) }); saveSemaine(w, 0); render(); }
    else if (act === "toggle-ru") { const s = new Set(cfg().midiRU || []); const v = Number(D.v); s.has(v) ? s.delete(v) : s.add(v); cfg().midiRU = [...s]; saveConfig(); renderSettings(); }
    else if (act === "save-settings") { const c = cfg(); c.equipement = [...app.querySelectorAll('input[data-set="equip"]:checked')].map(i => i.value); c.budgetSemaine = Math.max(10, Math.min(150, Number($("#st-budget").value) || 35)); c.magasin = ($("#st-magasin").value || "").trim().slice(0, 40); c.raccourciCourses = ($("#st-raccourci").value || "Courses").trim().slice(0, 40); c.essaiParSemaine = Number($("#st-essai").value) ? 1 : 0; saveConfig(); closeSettings(); render(); toast("Réglages enregistrés."); }
    else if (act === "signout") { await api.signOut(); S.session = null; viewLogin(); }
    else if (act === "copy-secret") { const sec = await api.secret(); if (!sec) return toast("Clé introuvable : exécute supabase/schema.sql."); copyText(sec, "Clé copiée."); }
    else if (act === "export") copyText(JSON.stringify({ config: S.config, aliments: S.aliments, recettes: S.recettes, semaines: S.semaines, stock: S.stock }, null, 1), "Export copié.");
    else if (act === "import") openDlg(`<h1>Importer</h1><p class="sub">Colle un export de Popote.</p><textarea id="imp"></textarea><p class="err" id="imp-err"></p><div class="acts"><button class="btn wide" data-act="import-go">Importer</button></div>`);
    else if (act === "import-go") { let d; try { d = JSON.parse($("#imp").value); } catch { return void ($("#imp-err").textContent = "JSON invalide."); } if (d.config) { S.config = Object.assign(clone(DEFAULT_CONFIG), d.config); saveConfig(); } let n = 0; for (const coll of ["aliments", "recettes", "semaines", "stock"]) for (const [id, o] of Object.entries(d[coll] || {})) { persist(coll, id, o); n++; } dlg.close(); render(); toast(`${plural(n, "document")} importé${n > 1 ? "s" : ""}.`); }
  } catch (err) { console.error(err); toast(err?.message || String(err), null, 4000); }
});
document.addEventListener("input", e => { if (e.target && e.target.id === "stock-q") stockFilter(e.target.value); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !dlg.open && tab === "settings") closeSettings(); });
setInterval(() => { if (tab === "home") render(); }, 60000);

// ───────────── Connexion et démarrage ─────────────
function viewLogin(msg = "") {
  tabsEl.hidden = true;
  app.innerHTML = `<section class="view" style="max-width:420px;margin:0 auto;padding-top:10vh"><h1 style="font-size:30px;font-weight:800;margin-bottom:6px">Popote</h1><p class="quiet">Même compte que Pages contre minutes.</p><form id="login"><label for="em">Email</label><input id="em" type="email" autocomplete="username" required><label for="pw">Mot de passe</label><input id="pw" type="password" autocomplete="current-password" required><p class="err">${esc(msg)}</p><button class="btn wide" style="margin-top:14px">Se connecter</button></form></section>`;
  $("#login").onsubmit = async e => { e.preventDefault(); const btn = $("#login button"); btn.disabled = true; try { await api.signIn($("#em").value.trim(), $("#pw").value); await start(); } catch (err) { viewLogin(/invalid/i.test(err.message) ? "Email ou mot de passe incorrect." : err.message); } };
}
async function start() {
  S.session = await api.session(); if (!S.session) return viewLogin();
  tabsEl.hidden = false; render(); await loadAll(); flush();
}
async function boot() {
  mirrorLoad();
  if (DEMO) { S.loaded = true; banner.textContent = "Mode local : les données restent dans ce navigateur."; banner.hidden = false; render(); return; }
  await start();
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && api && S.session) { loadAll(); flush(); } });
window.addEventListener("online", () => flush());
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
boot();
})();
</script>
</body>
</html>
